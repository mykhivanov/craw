openapi: 3.1.0

info:
  title: Craw API — devices addition
  version: 0.2.0
  description: |
    This contract DELTA adds a single endpoint, `POST /devices`, to the v1 Craw backend
    defined in `openspec/changes/archive/2026-05-24-add-auth-and-book-search/api-contract.yaml`.
    All other endpoints in v1 (`/auth/session`, `/user`, `/books/search`, `/books/quiz`) are
    unchanged.

    ## Why a separate device endpoint

    The mobile client obtains a Firebase Cloud Messaging (FCM) device token asynchronously
    after launch. The token can arrive before or after the Clerk-backed session is restored.
    Once both signals are present, the client POSTs the token here. The endpoint is **idempotent
    on the `(user_id, token)` pair**: repeated posts return the existing record (200) rather
    than creating duplicates (201). This lets the client safely retry on launch, token refresh,
    or transient network failures without server-side cleanup.

    `User.devices[]` is intentionally NOT added to the existing `User` schema in this change.
    Doing so would risk breaking the existing `APIUser` Swift decoder (which doesn't carry an
    optional `devices` field today) and is unnecessary for v1 — the client never needs to read
    the device list, only to register itself. A future change can add `User.devices[]` once a
    use case emerges.

servers:
  - url: https://api.craw.app/v1
    description: Production

security:
  - bearerAuth: []

paths:
  /devices:
    post:
      operationId: registerDevice
      summary: Register or refresh this device's push token for the authenticated user.
      description: |
        Idempotent upsert keyed on `(user_id, token)`. If a record for the same user and
        token already exists, the server updates `app_version`, `locale`, and `updated_at`
        in place and returns `200 OK` with the existing record. Otherwise it creates a new
        record and returns `201 Created`. The client SHOULD treat both responses identically.

        The client SHOULD call this endpoint:
          1. After bootstrap succeeds AND a FCM token is in hand (whichever arrives second).
          2. Whenever the FCM token changes (Firebase may rotate tokens at any time).

        The client SHOULD NOT call this endpoint when only one of (session, token) is present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "200":
          description: Existing device record updated. Body is the persisted record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "201":
          description: New device record created. Body is the persisted record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Rate limited.
          headers:
            Retry-After:
              schema:
                type: number
                format: float
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DeviceRegistration:
      type: object
      required: [token, platform, app_version, locale]
      properties:
        token:
          type: string
          description: The FCM registration token. Opaque to the client.
          minLength: 1
          maxLength: 4096
        platform:
          type: string
          enum: [ios]
          description: Currently only `ios` is supported.
        app_version:
          type: string
          description: |
            `CFBundleShortVersionString` of the calling app build (e.g. `1.4.2`). Used by the
            server for diagnostic correlation and potential version-gated payload shaping.
          maxLength: 32
        locale:
          type: string
          description: |
            BCP-47 identifier from `Locale.current.identifier(.bcp47)` (e.g. `en-US`). Used by
            the server to localize push payload copy.
          maxLength: 16

    Device:
      type: object
      required: [id, user_id, token, platform, app_version, locale, created_at, updated_at]
      properties:
        id:
          type: string
          description: Server-assigned UUID.
        user_id:
          type: string
          description: Clerk subject (matches `User.id`).
        token:
          type: string
        platform:
          type: string
          enum: [ios]
        app_version:
          type: string
        locale:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
